services:
  dbcheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: medusa-app:latest
    command: ["sh", "-c", "node dbcheck.js; echo '--- fin ---'; sleep 3600"]
    env_file: .env
    networks:
      - dokploy-network

  migrate:
    image: medusa-app:latest
    command: ["sh", "-c", "MEDUSA_DB_MIGRATION_CONNECTION_TIMEOUT=180000 npx medusa db:migrate > /tmp/migrate.log 2>&1; echo EXIT=$? >> /tmp/migrate.log; sleep 3600"]
    env_file: .env
    restart: "no"
    networks:
      - dokploy-network

  server:
    image: medusa-app:latest
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "9000"
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: "false"
      MEDUSA_DB_MIGRATION_CONNECTION_TIMEOUT: "180000"
    expose:
      - "9000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
